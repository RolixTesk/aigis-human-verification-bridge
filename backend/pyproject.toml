[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aigis-human-verification-bridge"
version = "0.1.0"
description = "Human-in-the-loop Aigis challenge bridge with GeeTest GT3/GT4 UI"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.141,<0.142",
  "pydantic>=2.12,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "playwright>=1.62,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aigis_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
